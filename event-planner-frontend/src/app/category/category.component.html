<div class="category-container">
  <div class="page-header">
    <h2 class="page-title">
      <mat-icon>category</mat-icon>
      Catégories
    </h2>
    <button mat-raised-button color="primary" (click)="open()" class="add-btn">
      <mat-icon>add</mat-icon> Nouvelle Catégorie
    </button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <div class="filter-row">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Rechercher...</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Nom de catégorie" #input />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>

      <div class="table-wrapper mat-elevation-z1">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
            <td mat-cell *matCellDef="let row"><strong>{{ row.name }}</strong></td>
          </ng-container>

          <ng-container matColumnDef="events_count">
            <th mat-header-cell *matHeaderCellDef>Événements</th>
            <td mat-cell *matCellDef="let row">
              <span class="count-badge">{{ row.events_count || 0 }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="accent" (click)="openEdit(row)" matTooltip="Modifier">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="delete(row.id)" matTooltip="Supprimer">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" colspan="4">
              <mat-icon>search_off</mat-icon>
              Aucune catégorie trouvée
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Sélectionner la page"></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
