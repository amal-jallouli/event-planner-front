<div class="form-container">
  <div class="form-header" mat-dialog-title>
    <div style="display:flex; align-items:center; gap:8px;">
      <mat-icon style="color:#ad1457">{{ isEdit ? 'edit' : 'add_circle' }}</mat-icon>
      <span>{{ isEdit ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}</span>
    </div>
    <button mat-icon-button (click)="close()"><mat-icon>close</mat-icon></button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="form" style="padding: 8px 0">
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Nom de la catégorie</mat-label>
        <input matInput formControlName="name" placeholder="ex: Technologie, Sport..." />
        <mat-icon matSuffix>label</mat-icon>
        <mat-error *ngIf="form.get('name')?.hasError('required')">Le nom est requis</mat-error>
        <mat-error *ngIf="form.get('name')?.hasError('minlength')">Minimum 2 caractères</mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Annuler</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
      <mat-icon>save</mat-icon>
      {{ isEdit ? 'Mettre à jour' : 'Créer' }}
    </button>
  </mat-dialog-actions>
</div>
