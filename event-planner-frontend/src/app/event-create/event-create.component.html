<div class="dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>
      <mat-icon>{{ isEdit ? 'edit' : 'add_circle' }}</mat-icon>
      {{ isEdit ? 'Modifier l\'événement' : 'Nouvel événement' }}
    </h2>
    <button mat-icon-button (click)="close()"><mat-icon>close</mat-icon></button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="form" class="event-form">
      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Titre</mat-label>
          <input matInput formControlName="title" placeholder="Titre de l'événement" />
          <mat-icon matSuffix>title</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Description..."></textarea>
        </mat-form-field>
      </div>

      <div class="form-row two-col">
        <mat-form-field appearance="outline">
          <mat-label>Date de début</mat-label>
          <input matInput [matDatepicker]="dpStart" formControlName="start_date" />
          <mat-datepicker-toggle matIconSuffix [for]="dpStart"></mat-datepicker-toggle>
          <mat-datepicker #dpStart></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date de fin</mat-label>
          <input matInput [matDatepicker]="dpEnd" formControlName="end_date" />
          <mat-datepicker-toggle matIconSuffix [for]="dpEnd"></mat-datepicker-toggle>
          <mat-datepicker #dpEnd></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-row two-col">
        <mat-form-field appearance="outline">
          <mat-label>Lieu</mat-label>
          <input matInput formControlName="place" placeholder="Ville, adresse..." />
          <mat-icon matSuffix>location_on</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Capacité</mat-label>
          <input matInput formControlName="capacity" type="number" min="1" />
          <mat-icon matSuffix>people</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-row two-col">
        <mat-form-field appearance="outline">
          <mat-label>Catégorie</mat-label>
          <mat-select formControlName="category_id">
            <mat-option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Statut</mat-label>
          <mat-select formControlName="status">
            <mat-option value="actif">Actif</mat-option>
            <mat-option value="archive">Archivé</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-row two-col">
        <div class="toggle-field">
          <label>Événement gratuit</label>
          <mat-slide-toggle formControlName="is_free" color="primary"></mat-slide-toggle>
        </div>

        <mat-form-field appearance="outline" *ngIf="!form.get('is_free')?.value">
          <mat-label>Prix (DT)</mat-label>
          <input matInput formControlName="price" type="number" min="0" step="0.5" />
          <mat-icon matSuffix>payments</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-row">
        <label class="file-label">Image (optionnel)</label>
        <input type="file" accept="image/*" (change)="onFileChange($event)" class="file-input" />
        <span class="file-hint" *ngIf="selectedFile">{{ selectedFile.name }}</span>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="close()">Annuler</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || loading" class="save-btn">
      <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!loading">save</mat-icon>
      <span>{{ isEdit ? 'Mettre à jour' : 'Créer' }}</span>
    </button>
  </mat-dialog-actions>
</div>
