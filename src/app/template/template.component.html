<div class="app-layout">
  <aside class="sidebar" [class.collapsed]="!opened">
    <div class="sidebar-brand">
      <div class="brand-logo"><mat-icon>event</mat-icon></div>
      <span class="brand-name">Event Planner</span>
    </div>
    <nav class="sidebar-nav">
      <a *ngIf="isAdmin()" class="nav-item" routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      <a class="nav-item" routerLink="/events" routerLinkActive="active">
        <mat-icon>event_note</mat-icon><span>Événements</span>
      </a>
      <a *ngIf="isAdmin()" class="nav-item" routerLink="/categories" routerLinkActive="active">
        <mat-icon>label</mat-icon><span>Catégories</span>
      </a>
      <a *ngIf="!isAdmin()" class="nav-item" routerLink="/my-registrations" routerLinkActive="active">
        <mat-icon>how_to_reg</mat-icon><span>Mes Inscriptions</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">{{ currentUser?.name?.charAt(0)?.toUpperCase() }}</div>
        <div class="user-info">
          <span class="user-name">{{ currentUser?.name }}</span>
          <span class="user-role">{{ currentUser?.role | uppercase }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" matTooltip="Déconnexion">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <button class="toggle-btn" (click)="opened = !opened"><mat-icon>menu</mat-icon></button>
      <div class="topbar-right">
        <span class="role-badge" [class.admin]="isAdmin()">{{ isAdmin() ? 'Admin' : 'User' }}</span>
        <div class="avatar">{{ currentUser?.name?.charAt(0)?.toUpperCase() }}</div>
      </div>
    </header>
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
