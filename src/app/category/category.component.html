<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Catégories</h1>
      <p class="page-subtitle">{{ dataSource.data.length }} catégories au total</p>
    </div>
    <button class="btn-create" (click)="open()">
      <mat-icon>add</mat-icon> Nouvelle catégorie
    </button>
  </div>

  <div class="card">
    <table mat-table [dataSource]="dataSource" matSort class="data-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let row"><span class="bold">{{ row.name }}</span></td>
      </ng-container>

      <ng-container matColumnDef="events_count">
        <th mat-header-cell *matHeaderCellDef>Événements</th>
        <td mat-cell *matCellDef="let row">
          <span class="count-tag">{{ row.events_count || 0 }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button class="action-btn edit" (click)="openEdit(row)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button class="action-btn delete" (click)="delete(row.id)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]"></mat-paginator>
  </div>
</div>
