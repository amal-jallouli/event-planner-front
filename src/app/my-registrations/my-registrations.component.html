<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Mes Inscriptions</h1>
      <p class="page-subtitle">{{ dataSource.data.length }} inscription(s)</p>
    </div>
  </div>

  <div class="card">
    <table mat-table [dataSource]="dataSource" matSort class="data-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="event_title">
        <th mat-header-cell *matHeaderCellDef>Événement</th>
        <td mat-cell *matCellDef="let row">
          <span class="bold">{{ row.event?.title || '-' }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="start_date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let row">
          {{ row.event?.start_date | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="place">
        <th mat-header-cell *matHeaderCellDef>Lieu</th>
        <td mat-cell *matCellDef="let row">{{ row.event?.place || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="registered_at">
        <th mat-header-cell *matHeaderCellDef>Inscrit le</th>
        <td mat-cell *matCellDef="let row">
          {{ row.created_at | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button class="action-btn delete" (click)="cancelRegistration(row.event_id)" matTooltip="Annuler">
            <mat-icon>cancel</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="no-data" colspan="6">Aucune inscription pour le moment</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]"></mat-paginator>
  </div>
</div>
